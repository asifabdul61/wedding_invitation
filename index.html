<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ffecd2, #fcb69f);
    text-align: center;
    color: #333;
}

.container {
    margin-top: 100px;
}

h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

h2 {
    font-size: 28px;
    margin: 10px 0;
}

p {
    font-size: 20px;
}

button {
    margin-top: 30px;
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    background: #ff7a7a;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #ff5252;
}
</style>
</head>

<body>

<div class="container">
    <h1>You're Invited!</h1>
    <h2>Wedding Celebration</h2>
    <p>We request your presence at our special day</p>

    <p><strong>Date:</strong> 10th December 2026</p>
    <p><strong>Venue:</strong> Your Venue Name</p>

    <button onclick="playMusic()">Enter Invitation</button>
</div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic() {
    const audio = document.getElementById("bgMusic");
    audio.play();
}
</script>

</body>
</html>
